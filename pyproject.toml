[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sri-txt-robot"
version = "0.1.0"
description = "Robot que descarga del portal del SRI los TXT de comprobantes electrónicos recibidos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Julio Serpone" }]
keywords = ["sri", "ecuador", "comprobantes", "playwright", "lambda"]

dependencies = [
    "playwright>=1.49,<2",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
sri-txt-robot = "sri_txt_robot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sri_txt_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sri_txt_robot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
