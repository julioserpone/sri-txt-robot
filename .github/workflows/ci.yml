name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estilo
        run: ruff check .

      - name: Análisis estático
        run: mypy

      - name: Pruebas
        run: pytest

      - name: Validar la imagen de contenedor
        run: docker build -t sri-txt-robot:ci .

  ci-success:
    name: ci-success
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests result: ${{ needs.tests.result }}"
            exit 1
          fi
          echo "Todas las verificaciones pasaron."
